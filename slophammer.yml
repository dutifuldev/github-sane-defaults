typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src
    exclude:
      - "tests/**"
      - "dist/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/app
      - src/cli
      - src/github/parse.ts
      - src/policy
      - src/shared
  dependency_boundaries:
    - from: src/cli
      allow:
        - src/app
        - src/github
        - src/shared
    - from: src/app
      allow:
        - src/github
        - src/policy
        - src/shared
    - from: src/github
      allow:
        - src/policy
        - src/shared
    - from: src/policy
      allow: []
    - from: src/shared
      allow: []
